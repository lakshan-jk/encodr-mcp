[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "encodr-mcp"
version = "0.1.0"
description = "A high-quality, local-first MCP server that exposes FFmpeg transcoding for video, audio, images, and streams."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lakshan Kumar JK" }]
keywords = ["mcp", "ffmpeg", "transcode", "video", "audio", "image", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Conversion",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
]
dependencies = [
    "mcp>=2.0,<3",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
encodr-mcp = "encodr_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/lakshan-jk/encodr-mcp"
Issues = "https://github.com/lakshan-jk/encodr-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/encodr_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["encodr_mcp"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
